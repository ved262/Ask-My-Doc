<div class="auth-page">
  <div class="brand">
    <div class="logo-mark"><mat-icon>auto_stories</mat-icon></div>
    <h1>AskMyDoc</h1>
    <p>{{ mode() === 'login' ? 'Welcome back' : 'Create your account' }}</p>
  </div>

  <form class="auth-card" (ngSubmit)="submit()">
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" name="email" autocomplete="email" [(ngModel)]="email" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Password</mat-label>
      <input
        matInput
        type="password"
        name="password"
        [autocomplete]="mode() === 'login' ? 'current-password' : 'new-password'"
        [(ngModel)]="password"
      />
      @if (mode() === 'register') {
        <mat-hint>At least 8 characters</mat-hint>
      }
    </mat-form-field>

    @if (errorMessage()) {
      <p class="error">{{ errorMessage() }}</p>
    }

    @if (isLoading()) {
      <mat-progress-bar mode="indeterminate" />
    }

    <button mat-flat-button type="submit" class="submit-btn" [disabled]="isLoading()">
      {{ mode() === 'login' ? 'Log in' : 'Create account' }}
    </button>

    <button mat-button type="button" class="toggle-btn" (click)="toggleMode()">
      {{ mode() === 'login' ? "No account? Register" : 'Have an account? Log in' }}
    </button>
  </form>
</div>
